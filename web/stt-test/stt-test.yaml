# STT side-by-side test page: https://stt-test.test-ai.cloud
# Code is mounted from the ConfigMap `stt-test-app` (server.js, index.html); see README.md.
apiVersion: v1
kind: Namespace
metadata:
  name: stt-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stt-test
  namespace: stt-test
  labels: {app: stt-test}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app: stt-test}
  template:
    metadata:
      labels: {app: stt-test}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: node:22-alpine
          command: ["node", "/app/server.js"]
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: LITELLM_BASE_URL, value: http://litellm.litellm.svc:4000/v1}
            - {name: NORMALIZE_MODEL, value: gemma4-26b-a4b}
            - {name: RATE_PER_MINUTE, value: "8"}
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef: {name: stt-test-litellm, key: api-key}
          volumeMounts:
            - {name: app, mountPath: /app, readOnly: true}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
          resources:
            requests: {cpu: 20m, memory: 48Mi}
            limits: {cpu: 300m, memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: app
          configMap: {name: stt-test-app}
---
apiVersion: v1
kind: Service
metadata:
  name: stt-test
  namespace: stt-test
spec:
  selector: {app: stt-test}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stt-test-test-ai
  namespace: stt-test
  labels:
    platform.clush.cloud/domain-alias: test-ai.cloud
  annotations:
    nginx.org/client-max-body-size: 11m
    nginx.org/proxy-read-timeout: 200s
    nginx.org/proxy-send-timeout: 200s
    nginx.org/proxy-set-headers: 'X-Forwarded-Proto: https, X-Forwarded-Port: 443'
    nginx.org/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: stt-test.test-ai.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: stt-test, port: {number: 8080}}
